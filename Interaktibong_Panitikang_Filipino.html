<style>
:root{--ink:#17243a;--muted:#536477;--bg:#f4f6fa;--paper:#fff;--line:#dbe2ec;--blue:#234c86;--green:#176b4a;--red:#9e3030}*{box-sizing:border-box}body{margin:0;font:16px/1.7 Aptos,Calibri,Arial,sans-serif;color:var(--ink);background:var(--bg)}header{background:#122b4c;color:white;padding:22px max(20px,calc((100vw - 1060px)/2));}header h1{font-size:22px;line-height:1.25;margin:0 0 5px}header p{margin:0;opacity:.8;font-size:13px}.shell{max-width:1060px;margin:22px auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:0 18px}.nav{position:sticky;top:18px;align-self:start;background:white;border:1px solid var(--line);border-radius:14px;padding:15px}.nav button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;background:transparent;color:var(--ink);border:0;border-radius:8px;padding:11px 9px;font:inherit;font-size:13px;cursor:pointer}.nav button.active{background:#eaf0f9;font-weight:700}.nav button:disabled{color:#96a0ae;cursor:not-allowed}.nav .symbol{width:20px;text-align:center}.progress{height:7px;border-radius:8px;background:#e2e7f0;overflow:hidden;margin:12px 0 4px}.progress span{display:block;height:100%;background:#3973b6;transition:width .25s}.paper{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,4vw,48px);min-height:65vh;box-shadow:0 7px 30px #17243a0a}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:800;color:var(--blue)}h2{font-size:clamp(24px,3vw,34px);line-height:1.22;margin:8px 0 15px}h3{font-size:19px;margin:30px 0 9px}p{margin:8px 0 15px}.lead{color:var(--muted)}.section{padding:0 0 8px;border-bottom:1px solid #edf0f4}.section:last-of-type{border:0}.definition{background:#f1f5fb;border-left:4px solid #5279ae;padding:12px 16px;border-radius:5px}.card{border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0}.question{font-weight:700;margin-bottom:10px}.option{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer}.option:hover{background:#f7f9fd}.option input{margin-top:6px;accent-color:var(--blue)}.option:has(input:checked){border-color:#4b75ad;background:#eef4fc}.feedback{margin-top:14px;padding:12px 14px;border-radius:8px;background:#f4f6fa;font-size:14px}.feedback.good{background:#eaf7f0;color:#145c3f}.feedback.bad{background:#fff1f1;color:#8e2e2e}.reasons{padding:8px 0 0 16px}.reasons li{margin:6px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}.btn{border:1px solid var(--blue);background:var(--blue);color:white;border-radius:9px;padding:10px 17px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:white;color:var(--blue)}.btn:disabled{opacity:.45;cursor:not-allowed}.note{color:var(--muted);font-size:14px}.tag{font-size:12px;color:#49627c;font-weight:700}.summary{background:#eff5fc;padding:18px;border-radius:10px}.reflect{width:100%;min-height:140px;border:1px solid #b8c7d8;border-radius:10px;padding:13px;font:inherit;resize:vertical}.pill{background:#e8f4ed;color:#196a4b;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}.score{font-size:34px;font-weight:800;color:var(--blue)}@media(max-width:720px){.shell{display:block;padding:0 10px}.nav{position:static;margin-bottom:14px}.nav-items{display:flex;overflow:auto;gap:3px}.nav button{white-space:nowrap;width:auto}.paper{padding:20px}header{padding:18px}.nav .progress{margin-top:6px}}@media print{header,.nav,.actions{display:none!important}.shell{display:block}.paper{box-shadow:none;border:0}.card{break-inside:avoid}}
</style></head><body><header><h1>Pag-unawa sa Panitikan at Panitikang Filipino</h1><p>GE Panitikang Filipino · Interaktibong pagbasa at pagtataya · Offline-ready</p></header><div class="shell"><aside class="nav"><div class="eyebrow">Mga pahina</div><div class="nav-items" id="nav"></div><div class="progress"><span id="bar"></span></div><div class="note" id="progtext"></div></aside><main class="paper" id="app" aria-live="polite"></main></div>
<script>const DATA={"intro": ["Awtlayn ng Talakayan, Checkpoints at Pangwakas na Pagtataya", "GE Panitikang Filipino | 60 minuto", "Paksa: Pag-unawa sa Iba’t Ibang Depinisyon at Pagpapahalaga sa Panitikan at Panitikang Filipino", "Desired Learning Outcome: Nauunawaan ang iba’t ibang depinisyon at napahahalagahan ang esensya ng Panitikang Filipino.", "Sentral na tanong: Ano ang nagpapaging Filipino sa Panitikang Filipino, at bakit mahalagang suriin kung sino at ano ang kinikilala bilang bahagi nito?", "Layunin: Maihambing ang tatlong konsepto ng Literaturang Filipino, masuri ang mga salik na nakaaapekto sa pagkilala sa mga akda, at maipaliwanag ang kabuluhan ng pagkakaiba-iba ng panitikan sa bansa.", "Daloy ng Talakayan", "• Panimulang gawain — 4 minuto", "• Konsepto 1 at checkpoint — 13 minuto", "• Konsepto 2 at checkpoint — 10 minuto", "• Konsepto 3 at checkpoint — 10 minuto", "• Konsepto 4 at checkpoint — 10 minuto", "• Pangwakas na pagtataya — 10 minuto", "• Sintesis — 3 minuto", "Panimulang Gawain: “Filipino ba ang Akdang Ito?”", "Ipakita ang tatlong sitwasyon: (A) isang nobelang isinulat sa Ingles ng Filipino na naninirahan sa Canada; (B) isang epikong pasalita ng katutubong pamayanan sa Mindanao; at (C) isang nobelang tungkol sa Pilipinas na isinulat ng dayuhang naninirahan sa Maynila.", "Tanong: Alin sa tatlong akda ang maituturing na bahagi ng Panitikang Filipino? Huwag munang magbigay ng iisang sagot. Usisain ang batayan: wika, nasyonalidad, teritoryo, o paksa. Layunin nitong makita na hindi iisa ang posibleng batayan ng depinisyon."], "concepts": [{"title": "Ang Tatlong Depinisyon ng Literaturang Filipino", "parts": [{"title": "Konsepto", "body": ["Ayon sa mga working definition ni Bienvenido Lumbera:", "Literature of the Philippines — teritoryo, o lawas ng mga akdang matatagpuan sa teritoryong tinatawag na Pilipinas", "Filipino Literature — nasyonalidad, o mga akdang nilikha ng mga Filipino na maaaring magtaglay ng tatak ng kanilang nasyonalidad;", "National Literature — bansa at pambansang kamalayan, o mga akdang may kaugnayan sa pakikilahok ng manunulat sa mga mithiin ng bansa.", "Magkakaugnay ang mga ito at hindi tatlong ganap na magkahiwalay na kategorya."]}, {"title": "Lecture Proper", "body": ["Ang pagkakaiba ng tatlo ay nasa pangunahing batayan ng pagkilala sa akda. Sa Literature of the Philippines, mahalaga ang teritoryo at magkakaugnay na kasaysayan ng mga akdang nabuo rito. Sa Filipino Literature, mahalaga ang nasyonalidad ng manunulat; hindi kailangang nakasulat sa wikang Filipino ang isang akda. Sa National Literature, mahalaga ang politikal na katangian ng produksiyong pampanitikan: paano nakikilahok ang akda sa pagbuo at pag-unawa sa bansa?"]}, {"title": "Halimbawa", "body": ["Ang nobelang isinulat sa Ingles ng Filipino sa Canada ay maaaring ituring na Filipino Literature batay sa nasyonalidad ng awtor. Maaari rin itong magkaroon ng kabuluhan sa National Literature kung makikita sa akda ang pakikilahok sa mga usapin at mithiin ng bansang Filipino; hindi ito awtomatiko dahil lamang sa nasyonalidad."]}, {"title": "Implikasyon", "body": ["Hindi sapat ang wika o lugar lamang upang tukuyin ang Panitikang Filipino. Kilalanin ang ugnayan ng awtor, akda, kasaysayan, at bansa."]}, {"title": "Pamprosesong Ideya", "body": ["Kung Filipino ang manunulat ngunit banyagang wika ang ginamit, nababawasan ba ang pagka-Filipino ng kaniyang akda? Bakit? Inaasahang pag-unawa: Hindi dapat ipagkamali ang wikang Filipino sa buong saklaw ng Literaturang Filipino."]}], "questions": [{"text": "Isang Filipino sa Japan ang sumulat ng nobela sa Ingles. Aling konsepto ang pinakadirektang sumasaklaw dito batay sa nasyonalidad ng awtor?", "options": ["National Literature", "Filipino Literature", "Regional Literature", "Literature of the Philippines"], "correct": 1, "reasons": ["Hindi sapat ang nasyonalidad lamang upang maipakita ang pambansang mithiin.", "Tama. Nasyonalidad ng awtor ang pangunahing batayan dito.", "Hindi rehiyon ang pangunahing batayan ng sitwasyon.", "Teritoryo ng Pilipinas ang pangunahing diin ng konseptong ito."]}, {"text": "Nagsaliksik ang klase ng kabuuan ng mga akdang matatagpuan sa teritoryo ng Pilipinas. Aling konsepto ang ginagamit?", "options": ["National Literature", "Filipino Literature", "Regional Literature", "Literature of the Philippines"], "correct": 3, "reasons": ["Nakatuon ito sa pambansang kamalayan at mithiin.", "Nakatuon ito sa nasyonalidad ng mga manunulat.", "Nakatuon ito sa mga panitikang nakaugat sa rehiyon.", "Tama. Teritoryo ang pangunahing batayan ng saklaw."]}, {"text": "Sumulat ang isang makata tungkol sa pakikibaka at mithiin ng bansang kinabibilangan niya. Aling konsepto ang higit na binibigyang-diin?", "options": ["National Literature", "Regional Literature", "Filipino Literature", "Literature of the Philippines"], "correct": 0, "reasons": ["Tama. Binibigyang-diin ang ugnayan sa bansa at mithiin nito.", "Hindi rehiyonal na identidad ang sentrong usapin.", "Hindi lamang nasyonalidad ng awtor ang binibigyang-diin.", "Hindi teritoryal na saklaw ang pangunahing usapin."]}]}, {"title": "Kanon, Kolonyalismo, at Edukasyon", "parts": [{"title": "Konsepto", "body": ["Ang kanon ay tumutukoy sa mga akdang kinikilalang mahalaga at karapat-dapat basahin, pag-aralan, at ituro sa isang tradisyong pampanitikan. Sa pagsusuri ni Lumbera, may papel ang kolonyal na edukasyon sa pagkilala sa ilang akda bilang pambansa, habang naisantabi ang marami sa mga akdang nasa wikang rehiyonal."]}, {"title": "Lecture Proper", "body": ["Hindi nabubuo ang kanon nang hiwalay sa lipunan. Isang mahalagang ugnayang maaaring suriin: kolonyal na sistema ng edukasyon → wika at pamantayang pampanitikan → pagpili ng mga akdang itinuturo → pagkilala sa pambansang kanon. Hindi ibig sabihin nito na edukasyon lamang ang humuhubog sa kanon. Hindi rin awtomatikong mas mahalaga ang isang akda dahil kasama ito sa kanon."]}, {"title": "Halimbawa", "body": ["Kung halos Tagalog, Ingles, at Kastila lamang ang mga akda sa antolohiya ng Panitikang Filipino, maaaring magkaroon ng impresyon na ang mga wikang ito lamang ang kumakatawan sa pambansang panitikan. Paano naman ang Cebuano, Hiligaynon, Waray, at iba pang wika?"]}, {"title": "Implikasyon", "body": ["Ang pagkilala sa isang akda bilang mahalaga ay maaaring maimpluwensiyahan ng mga institusyong pumipili at nagpapalaganap nito. Kailangang maging kritikal sa mga tekstong pinipiling basahin at ituro."]}, {"title": "Pamprosesong Ideya", "body": ["Kung hindi kasama sa textbook ang isang akda, nangangahulugan bang hindi ito mahalagang bahagi ng Panitikang Filipino? Inaasahang pag-unawa: Hindi lamang kasikatan o pagiging kanonikal ang batayan ng halaga ng akda."]}], "questions": [{"text": "Isang antolohiya ang naglalaman lamang ng mga akdang matagal nang itinuturo. Ano ang pinakamahalagang dapat siyasatin?", "options": ["Popularidad ng mga awtor", "Haba ng mga akda", "Pamantayan sa pagpili", "Dami ng mga pahina"], "correct": 2, "reasons": ["Hindi popularidad lamang ang nagpapaliwanag sa pagpili.", "Hindi haba ang sentrong isyu ng kanon.", "Tama. Sinusuri kung bakit kinilala ang ilang akda.", "Hindi bilang ng pahina ang usapin."]}, {"text": "Bakit maaaring makaapekto ang kolonyal na edukasyon sa pagbuo ng kanon?", "options": ["Nahuhubog nito ang pamantayan", "Napapantay nito ang mga wika", "Nawawala nito ang lahat ng akda", "Napapawi nito ang pagkakaibang kultural"], "correct": 0, "reasons": ["Tama. Naiimpluwensiyahan nito ang pagpili at pagpapahalaga.", "Hindi nito awtomatikong napapantay ang mga wika.", "Hindi nito literal na inaalis ang lahat ng akda.", "Hindi awtomatikong nawawala ang pagkakaibang kultural."]}, {"text": "Hindi naisama sa textbook ang isang akdang Hiligaynon. Ano ang pinakamaingat na kongklusyon?", "options": ["Walang halaga ang akda", "Mahina ang kalidad nito", "Hindi ito bahagi ng kultura", "Maaaring limitado ang pagpili"], "correct": 3, "reasons": ["Hindi batayan ng kawalan ng halaga ang pagkakabukod.", "Hindi nasusukat ang kalidad sa pagkakasama sa textbook.", "Bahagi pa rin ito ng isang tradisyong kultural.", "Tama. Maaaring may limitasyon ang pagpiling institusyonal."]}]}, {"title": "Panitikang Panrehiyon at Panitikang Pambansa", "parts": [{"title": "Konsepto", "body": ["Sa “Panitikang Panrehiyon, Panitikang Pambansa: Magkabukod at Magkarugtong,” binibigyang-diin ang ugnayan ng dalawa. May sariling katangian ang panitikang panrehiyon at nakaugat sa partikular na kultura at karanasan; hindi ito hiwalay o mas mababa kaysa pambansang panitikan."]}, {"title": "Lecture Proper", "body": ["Ihambing ang dalawang pananaw: (a) herarkikal na pananaw na inilalagay ang pambansang panitikan sa itaas ng panrehiyon; at (b) magkaugnay na pananaw kung saan may sariling katangian ang dalawa at maaari silang magpayaman sa isa’t isa. Ang ikalawa ang dapat bigyang-diin: hindi kailangang talikuran ang lokal na wika at identidad upang makapag-ambag sa pambansang panitikan."]}, {"title": "Halimbawa", "body": ["Isang epikong pasalita ng katutubong pamayanan sa Mindanao ang naglalarawan ng kanilang paniniwala, kasaysayan, at pananaw sa mundo. Bagaman nakaugat sa isang pamayanan, nakapag-aambag ito sa mas malawak na pag-unawa sa pagkakaiba-iba ng karanasang Filipino."]}, {"title": "Implikasyon", "body": ["Hindi kailangang mawala ang identidad ng rehiyon upang maging bahagi ng pambansang panitikan. Maaaring payamanin ng pagkakaiba-iba ang pambansang identidad sa halip na piliting maging magkakatulad ang lahat."]}, {"title": "Pamprosesong Ideya", "body": ["Kung ang Pilipinas ay binubuo ng iba’t ibang wika at kultura, makatarungan bang iisang wika o rehiyon lamang ang kumatawan sa buong Panitikang Filipino? Inaasahang pag-unawa: Ang pagkakaisa ay hindi nangangailangan ng pagkakapare-pareho ng karanasan."]}], "questions": [{"text": "May epikong nakaugat sa kulturang Maranao. Paano ito maaaring magkaroon ng pambansang kabuluhan?", "options": ["Sa pagtalikod sa pinagmulan", "Sa pag-ambag ng karanasan", "Sa paggamit lamang ng Tagalog", "Sa pag-alis ng katutubong katangian"], "correct": 1, "reasons": ["Hindi kailangang talikuran ang pinagmulan.", "Tama. Nagpapayaman sa pambansang pag-unawa ang karanasang rehiyonal.", "Hindi kailangang Tagalog ang wika ng akda.", "Hindi kailangang burahin ang katutubong katangian."]}, {"text": "Tinawag na mababa ang panitikang panrehiyon kumpara sa pambansa. Ano ang suliranin dito?", "options": ["Pagkilala sa pagkakaiba", "Pagpapanatili ng tradisyon", "Paglikha ng herarkiya", "Pag-aaral ng kasaysayan"], "correct": 2, "reasons": ["Hindi mali ang pagkilala sa mga pagkakaiba.", "Hindi pagpapanatili ng tradisyon ang pangunahing problema.", "Tama. Ipinapalagay na mas mataas ang pambansa.", "Hindi mismo ang pag-aaral ng kasaysayan ang suliranin."]}, {"text": "Alin ang pinakamainam na ugnayan ng panitikang panrehiyon at pambansa?", "options": ["Magkaiba ngunit magkaugnay", "Magkatulad sa lahat ng aspekto", "Magkalaban sa bawat pagkakataon", "Magkahiwalay at walang ugnayan"], "correct": 0, "reasons": ["Tama. May pagkakaiba ngunit kapwa maaaring magpayaman.", "Hindi sila magkakatulad sa lahat ng katangian.", "Hindi kinakailangang magkalaban ang dalawa.", "May mga ugnayang historikal at kultural ang dalawa."]}]}, {"title": "Katutubong Estetika at Pagpapahalaga sa Panitikang Filipino", "parts": [{"title": "Konsepto", "body": ["Ang estetika ay tumutukoy sa mga pananaw at pamantayan sa kagandahan at pagpapahalaga sa sining. Sa panawagan ni Lumbera tungkol sa katutubong estetika, mahalagang suriin ang mga pamantayang minana sa kolonyal na edukasyon, lalo na kung nagiging dahilan ang mga ito upang maisantabi ang mga akdang nasa katutubong wika."]}, {"title": "Lecture Proper", "body": ["Magsimula sa tanong: “Sino ang nagturo sa atin kung ano ang magandang panitikan?” Hindi lahat ng tradisyong pampanitikan ay kailangang sumunod sa iisang pamantayan. Ang epikong pasalita ay may mga katangiang naiiba sa nakalimbag na nobela. Kung pamantayan sa nobela lamang ang gagamitin, maaaring hindi mapahalagahan ang epiko. Hindi nito hinihinging tanggihan ang lahat ng banyagang pamantayan; kailangang suriin kung angkop ang pamantayan sa akda."]}, {"title": "Halimbawa", "body": ["Paghambingin ang nobelang Ingles na kinikilala sa pamantasan at ang epikong pasalita na ipinapasa sa mga henerasyon. Kung ipagpapalagay na mas mahusay ang nobela dahil nakalimbag at may kinikilalang awtor, maaaring hindi mapansin ang kolektibong alaala, tradisyon, at paraan ng paglikha ng epiko."]}, {"title": "Implikasyon", "body": ["Ang pagpapahalaga sa Panitikang Filipino ay nangangailangan ng pagiging bukas sa iba’t ibang anyo, wika, tradisyon, at paraan ng pagpapahayag. Suriin din ang sariling pananaw bago husgahan ang isang akda."]}, {"title": "Pamprosesong Ideya", "body": ["Kapag hindi tumutugon ang katutubong akda sa pamantayang nakasanayan, mababa ba ang kalidad nito, o kailangan nating suriin ang mismong pamantayan? Inaasahang pag-unawa: Maaaring ang limitasyon ay nasa pamantayan, hindi sa halaga ng akda."]}], "questions": [{"text": "Hindi umaayon ang isang katutubong epiko sa pamantayan ng Kanluraning nobela. Ano ang nararapat gawin?", "options": ["Ituring itong mababang panitikan", "Baguhin ang buong epiko", "Itigil ang pag-aaral dito", "Suriin ang angkop na pamantayan"], "correct": 3, "reasons": ["Hindi angkop na agad husgahang mababa ang akda.", "Hindi kailangang baguhin ang epiko upang tumugma.", "Hindi dapat ihinto ang pag-aaral dahil sa pagkakaiba.", "Tama. Suriin ang pamantayang angkop sa tradisyon."]}, {"text": "Bakit mahalagang pag-aralan ang katutubong estetika sa pagsusuri ng panitikan?", "options": ["Upang alisin ang lahat ng teorya", "Upang kilalanin ang sariling tradisyon", "Upang iwasan ang paghahambing", "Upang gawing magkakatulad ang akda"], "correct": 1, "reasons": ["Hindi kinakailangang alisin ang lahat ng teorya.", "Tama. Nabibigyang-halaga ang sariling pamantayan at tradisyon.", "Maaari pa ring maging makabuluhan ang paghahambing.", "Hindi layuning gawing magkakatulad ang mga akda."]}, {"text": "Alin ang pinakamalalim na pagpapahalaga sa Panitikang Filipino?", "options": ["Pagkabisado ng lahat ng pamagat", "Pagsang-ayon sa lahat ng akda", "Pagkilala sa sari-saring tinig", "Pagpili lamang ng sikat na akda"], "correct": 2, "reasons": ["Hindi sapat ang pagsasaulo upang maipakita ang pagpapahalaga.", "Maaaring magpahalaga kahit kritikal sa isang akda.", "Tama. Kinikilala ang pagkakaiba-iba ng mga karanasan.", "Hindi popularidad lamang ang batayan ng halaga."]}]}], "final": [{"text": "May nobelang isinulat ng isang Filipino sa Australia tungkol sa buhay ng mga migranteng Filipino. Ano ang pinakamatibay na batayan upang kilalanin itong Literaturang Filipino?", "options": ["Lugar ng paglilimbag", "Wika ng nobela", "Nasyonalidad ng awtor", "Popularidad ng akda"], "correct": 2, "reasons": ["Hindi lugar ng paglilimbag ang pangunahing batayan.", "Hindi kailangang wikang Filipino ang gamit.", "Tama. Pangunahing batayan ang nasyonalidad ng manunulat.", "Hindi nakabatay sa popularidad ang klasipikasyon."]}, {"text": "Nais ng isang kolehiyo na suriin kung bakit ilang wika lamang ang kinakatawan sa antolohiya. Aling konsepto ang pinakamakabuluhan?", "options": ["Pagbuo ng kanon", "Pagsukat ng taludtod", "Pagkilala sa persona", "Pagbilang ng saknong"], "correct": 0, "reasons": ["Tama. Sinusuri nito ang mga pamantayan sa pagpili.", "Elemento ito ng estruktura ng tula.", "Konsepto ito tungkol sa nagsasalita sa akda.", "Hindi ito tumutugon sa pagpili ng antolohiya."]}, {"text": "Isang awtor ang lumilikha ng mga akdang nakaugnay sa pambansang mithiin at kamalayan. Aling konsepto ang pinakamalapit?", "options": ["Literature of the Philippines", "Regional Literature", "Filipino Literature", "National Literature"], "correct": 3, "reasons": ["Teritoryo ang pangunahing batayan nito.", "Hindi rehiyonal na identidad ang pangunahing diin.", "Nasyonalidad ang pangunahing batayan nito.", "Tama. Nakatuon ito sa bansa at mga mithiin nito."]}, {"text": "Hindi kinilala ang isang akdang katutubo dahil hindi ito sumusunod sa nakasanayang Kanluraning anyo. Ano ang pinakamainam na hakbang?", "options": ["Itakwil ang akdang katutubo", "Suriin ang pamantayang estetiko", "Baguhin ang katutubong anyo", "Itigil ang paghahambing"], "correct": 1, "reasons": ["Hindi sapat ang pagkakaiba upang itakwil ang akda.", "Tama. Kailangang suriin ang pagiging angkop ng pamantayan.", "Hindi kailangang baguhin ang orihinal na anyo.", "Maaari pa ring maging kapaki-pakinabang ang kritikal na paghahambing."]}, {"text": "Tinawag ng isang kritiko na mas mababa ang lahat ng akdang rehiyonal dahil hindi pambansa ang kanilang saklaw. Ano ang pinakamainam na tugon?", "options": ["Laging superior ang pambansa", "Dapat alisin ang rehiyonal", "Hindi batayan ang herarkiya", "Walang pagkakaiba ang dalawa"], "correct": 2, "reasons": ["Hindi awtomatikong nakahihigit ang pambansa.", "Hindi dapat burahin ang panitikang rehiyonal.", "Tama. Hindi dapat gawing herarkiya ang pagkakaiba.", "May natatanging katangian pa rin ang dalawang kategorya."]}, {"text": "Nagtipon ang mga mananaliksik ng mga akdang pampanitikan mula sa iba’t ibang bahagi ng kapuluan. Aling konsepto ang pangunahing ginagamit sa pagtukoy ng saklaw?", "options": ["Literature of the Philippines", "National Literature", "Filipino Literature", "Literary canon"], "correct": 0, "reasons": ["Tama. Nakatuon ito sa mga akda sa teritoryo.", "Nakatuon ito sa pambansang mithiin.", "Nakatuon ito sa nasyonalidad ng awtor.", "Tumutukoy ito sa pagkilala at pagpili ng mga akda."]}, {"text": "Nais ng isang guro na palawakin ang kinakatawang karanasan sa kurso. Aling gawain ang higit na naaayon sa layuning ito?", "options": ["Ulitin lamang ang kanon", "Piliin lamang ang popular", "Limitahan ang gamit na wika", "Isama ang panitikang rehiyonal"], "correct": 3, "reasons": ["Maaaring manatiling limitado ang representasyon.", "Hindi kasikatan lamang ang bata
